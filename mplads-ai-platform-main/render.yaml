services:
  - type: web
    name: mplads-ai-backend
    runtime: python
    plan: free
    rootDir: mplads-ai-platform-main/backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SBERT_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: SBERT_ONNX_FILE
        value: onnx/model_quint8_avx2.onnx
      - key: SBERT_BATCH_SIZE
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
